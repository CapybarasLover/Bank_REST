version: '3.8'
services:
  backend:
    env_file: .env
    build:
      context: .
    container_name: bank_backend
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - db_network
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    container_name: bank_db
    env_file: .env
    ports:
      - "5432:5432" # Потом можно убрать для безопасности - доступ будет только по сети db_network в бэкенде
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - db_network
    restart: unless-stopped

  
volumes:
  db-data:

networks:
  db_network:
    driver: bridge