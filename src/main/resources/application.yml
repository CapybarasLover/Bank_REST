server:
  port: 8080
spring:
  profiles:
    active: dev # для использования в контейнере используем prod, в случае локального запуска на машине - dev
  application:
    name: bank-rest
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    change-log: classpath:db/db.changelog-master.yaml
#  - Настроить параметры безопасности и JWT.
#  - Включить Swagger UI.
